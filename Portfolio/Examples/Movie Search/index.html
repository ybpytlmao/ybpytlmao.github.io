<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie & TV Search</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script> <!-- optional JS you’ll add -->
</head>
<body class="night"><!-- default; you can toggle classes via JS if you want -->
  <main class="wrap">
    <section class="card">
      <h1>Movie & TV Search</h1>

      <!-- Search -->
      <form id="searchForm" class="search" autocomplete="off" aria-label="Search movies and shows">
        <input id="queryInput" type="text" placeholder="Search titles..." aria-label="Title" />
        <button type="submit" class="btn">Search</button>
      </form>

      <!-- Filters / actions -->
      <div class="actions">
        <div class="units" role="group" aria-label="Type filter">
          <button id="typeAll" class="chip chip-active" type="button" data-type="all">All</button>
          <button id="typeMovie" class="chip" type="button" data-type="movie">Movies</button>
          <button id="typeShow" class="chip" type="button" data-type="show">TV</button>
        </div>
        <button id="clearBtn" class="btn btn-ghost" type="button">Clear</button>
      </div>

      <!-- Status / errors -->
      <div id="status" class="status" aria-live="polite"></div>

      <!-- Results -->
      <section id="results" class="grid" aria-label="Search results">
        <!-- Example card markup you can render via JS:
        <article class="tile">
          <div class="poster-wrap">
            <img src="poster.jpg" alt="Inception poster" loading="lazy" />
          </div>
          <div class="meta">
            <h3 class="title" title="Inception">Inception</h3>
            <p class="sub">2010 • ⭐ 8.8 • Movie</p>
          </div>
        </article>
        -->
      </section>
    </section>

    <footer class="foot">
      <small>Data: WatchMode • Built by Luke (ybpyt)</small>
    </footer>
  </main>

  <!-- Optional details modal shell (hook up with JS later) -->
  <dialog id="detailsModal" class="modal">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-body">
      <div class="modal-poster">
        <img id="modalPoster" alt="" />
      </div>
      <div class="modal-content">
        <h2 id="modalTitle"></h2>
        <p id="modalMeta" class="muted"></p>
        <p id="modalPlot"></p>
      </div>
    </div>
  </dialog>
</body>
</html>
